<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple CRUD</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>CRUD SAMPLE</h1>

    <input type="hidden" id="id">
        <div class = "text">
        <input type="text" id="name" placeholder="Enter your name" required>
        <input type="email" id="email" placeholder="Enter your email" required>
        <button onclick="addUser()">Save</button>

    </div>

    <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>

<script>
function loadData() {
    fetch("api.php?action=read")
    .then(res => res.json())
    .then(data => {
        let rows = "";
        data.forEach(user => {
            rows += `
            <tr>
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>
                    <button class="edit-btn" 
                        data-id="${user.id}" 
                        data-name="${user.name.replace(/"/g, "&quot;")}" 
                        data-email="${user.email.replace(/"/g, "&quot;")}">
                        Edit
                    </button>
                    <button class="delete-btn" data-id="${user.id}">Delete</button>
                </td>
            </tr>`;
        });
        document.getElementById("data").innerHTML = rows;

        // Add event listeners for Edit buttons
        document.querySelectorAll(".edit-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                editUser(btn.dataset.id, btn.dataset.name, btn.dataset.email);
            });
        });

        // Add event listeners for Delete buttons
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", () => deleteUser(btn.dataset.id));
        });
    })
    .catch(err => console.error("Error loading data:", err));
}

function addUser() {
    let id = document.getElementById("id").value;
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();

    // Validation
    if(!name || !email){
        alert("Please fill name and email");
        return;
    }
    if(!/\S+@\S+\.\S+/.test(email)){
        alert("Invalid email format.");
        return;
    }

    let form = new FormData();
    form.append("name", name);
    form.append("email", email);
    if(id) form.append("id", id); 

    let action = id ? "update" : "create";

    fetch("api.php?action=" + action, { method: "POST", body: form })
    .then(res => res.text())
    .then(() => {
        
        document.getElementById("id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        loadData();
    })
    .catch(err => console.error("Error saving data:", err));
}

function editUser(id, name, email) {
    document.getElementById("id").value = id;
    document.getElementById("name").value = name;
    document.getElementById("email").value = email;
}

function deleteUser(id) {
    if(!confirm("Are you sure you want to delete this user?")) return;
    let form = new FormData();
    form.append("id", id);
    fetch("api.php?action=delete", { method: "POST", body: form })
    .then(() => loadData())
    .catch(err => console.error("Error deleting data:", err));
}

// Load data on page load
loadData();
</script>

</body>
</html>
